<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sealion</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="http://d3js.org/d3.v3.min.js" charset="utf-8"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sealion.css">
  </head>
  <body>
    <div id="app">
      <!-- Bootstrap Toolbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1"><i class="bi bi-dna me-2"></i>Sealion</span>
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarControls" aria-controls="navbarControls" aria-expanded="false" aria-label="Toggle controls">
            <span class="navbar-toggler-icon"></span>
          </button>
          
          <div class="collapse navbar-collapse" id="navbarControls">
            <div class="navbar-nav me-auto">
              <!-- Font Size Controls -->
              <div class="nav-item">
                <div class="btn-group" role="group" aria-label="Font size controls">
                  <button class="btn btn-sm btn-outline-secondary" id="font-decrease-btn" type="button" title="Decrease font size">
                    <i class="bi bi-zoom-out"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" id="font-increase-btn" type="button" title="Increase font size">
                    <i class="bi bi-zoom-in"></i>
                  </button>
                </div>
              </div>
              
              <!-- Column Collapse/Expand Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group" aria-label="Column collapse controls">
                  <button class="btn btn-sm btn-outline-secondary" id="collapse-columns-btn" type="button" title="Collapse selected columns (Cmd -)">
                    <i class="bi bi-arrows-collapse" style="display: inline-block; transform: rotate(90deg);"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" id="expand-columns-btn" type="button" title="Expand selected columns (Cmd =)">
                    <i class="bi bi-arrows-expand" style="display: inline-block; transform: rotate(90deg);"></i>
                  </button>
                  <div class="btn-group" role="group">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Collapse presets">
                      <i class="bi bi-funnel"></i>
                    </button>
                    <ul class="dropdown-menu">
                      <li>
                        <button class="dropdown-item" id="apply-constant-mask-btn" type="button">
                          <i class="bi bi-filter"></i> Constant sites
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" id="apply-constant-ambiguous-btn" type="button">
                          <i class="bi bi-filter"></i> Constant (allow N)
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" id="apply-constant-gapped-btn" type="button">
                          <i class="bi bi-filter"></i> Constant (allow N & -)
                        </button>
                      </li>
                      <li><hr class="dropdown-divider"></li>
                      <li>
                        <button class="dropdown-item" id="expand-all-btn" type="button">
                          <i class="bi bi-arrows-expand"></i> Expand all
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" id="collapse-all-btn" type="button">
                          <i class="bi bi-arrows-collapse"></i> Collapse all
                        </button>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
              
              <!-- Reference Controls -->
              <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="refDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-palette"></i> Colour
                </a>
                <ul class="dropdown-menu" aria-labelledby="refDropdown">
                  <li>
                    <button class="dropdown-item" id="colour-all-btn" type="button">
                      <i class="bi bi-palette-fill"></i> Colour all sites
                    </button>
                  </li>
                  <li>
                    <button class="dropdown-item" id="colour-diff-btn" type="button">
                      <i class="bi bi-palette"></i> Colour differences only
                    </button>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                    <button class="dropdown-item" id="set-ref-btn" type="button">
                      <i class="bi bi-pin-angle"></i> Set selected as reference
                    </button>
                  </li>
                  <li>
                    <button class="dropdown-item" id="diff-consensus-btn" type="button">
                      <i class="bi bi-calculator"></i> Set consensus as reference
                    </button>
                  </li>
                </ul>
              </div>
            </div>
            
            <!-- Search -->
            <form class="d-flex" role="search" onsubmit="return false;">
              <input class="form-control me-2" type="search" id="search-input" placeholder="Search sequences" aria-label="Search">
              <button class="btn btn-outline-primary" id="search-next" type="button">
                <i class="bi bi-search"></i> Next
              </button>
            </form>
          </div>
        </div>
      </nav>

      <!-- initialization status is shown in a centered overlay (#center-status) managed by the main script -->

      <div id="sealion"></div>

      <!-- debug HUD removed; use console for diagnostics -->
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <script type="text/javascript" src="alignment.js"></script>
    <script type="text/javascript" src="sealion.js"></script>
    <script type="text/javascript" src="sealion/utils.js"></script>
    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
