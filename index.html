<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sealion</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>
    
    <script src="http://d3js.org/d3.v3.min.js" charset="utf-8"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sealion.css">
    <link rel="stylesheet" href="docs.css">
  </head>
  <body>
    <div id="app">
      <!-- Bootstrap Toolbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1"><i class="bi bi-dna me-2"></i>Sealion</span>
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarControls" aria-controls="navbarControls" aria-expanded="false" aria-label="Toggle controls">
            <span class="navbar-toggler-icon"></span>
          </button>
          
          <div class="collapse navbar-collapse" id="navbarControls">
            <div class="navbar-nav me-auto">
              <!-- Open File Button -->
              <div class="nav-item">
                <button class="btn btn-sm btn-outline-primary" id="open-file-btn" type="button" title="Open FASTA file (Cmd-O)">
                  <i class="bi bi-folder2-open"></i>
                </button>
              </div>
              
              <!-- Font Size Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group" aria-label="Font size controls">
                  <button class="btn btn-sm btn-outline-secondary" id="font-decrease-btn" type="button" title="Decrease font size">
                    <i class="bi bi-zoom-out"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" id="font-increase-btn" type="button" title="Increase font size">
                    <i class="bi bi-zoom-in"></i>
                  </button>
                </div>
              </div>
              
              <!-- Dark Mode Toggle -->
              <div class="nav-item ms-2">
                <button class="btn btn-sm btn-outline-secondary" id="toggle-dark-mode-btn" type="button" title="Toggle dark mode">
                  <i class="bi bi-moon-fill"></i>
                </button>
              </div>
              
              <!-- Column Collapse/Expand Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group" aria-label="Column collapse controls">
                  <button class="btn btn-sm btn-outline-secondary" id="collapse-columns-btn" type="button" title="Collapse selected columns (Cmd -)">
                    <i class="bi bi-arrows-collapse" style="display: inline-block; transform: rotate(90deg);"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" id="expand-columns-btn" type="button" title="Expand selected columns (Cmd =)">
                    <i class="bi bi-arrows-expand" style="display: inline-block; transform: rotate(90deg);"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" id="toggle-hide-mode-btn" type="button" title="Toggle hide mode (Cmd H) - hides collapsed regions with center markers">
                    <i class="bi bi-eye-slash"></i>
                  </button>
                  <div class="btn-group" role="group">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Collapse presets">
                      <i class="bi bi-funnel"></i>
                    </button>
                    <ul class="dropdown-menu">
                      <li>
                        <button class="dropdown-item" id="apply-constant-mask-btn" type="button">
                          <i class="bi bi-filter"></i> Constant sites
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" id="apply-constant-ambiguous-btn" type="button">
                          <i class="bi bi-filter"></i> Constant (allow N)
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" id="apply-constant-gapped-btn" type="button">
                          <i class="bi bi-filter"></i> Constant (allow N & -)
                        </button>
                      </li>
                      <li><hr class="dropdown-divider"></li>
                      <li>
                        <button class="dropdown-item" id="expand-all-btn" type="button">
                          <i class="bi bi-arrows-expand"></i> Expand all
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" id="collapse-all-btn" type="button">
                          <i class="bi bi-arrows-collapse"></i> Collapse all
                        </button>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
              
              <!-- Colour Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-palette"></i> Colour
                  </button>
                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item" id="colour-all-btn" type="button">
                        <i class="bi bi-palette-fill"></i> Colour all sites
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="colour-diff-btn" type="button">
                        <i class="bi bi-palette"></i> Colour differences only
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="set-ref-btn" type="button">
                        <i class="bi bi-pin-angle"></i> Set selected as reference
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="diff-consensus-btn" type="button">
                        <i class="bi bi-calculator"></i> Set consensus as reference
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item nucleotide-color-scheme-btn" data-scheme="default" type="button">
                        <i class="bi bi-circle-fill" style="color: #2ca02c;"></i>
                        <i class="bi bi-circle-fill" style="color: #1f77b4;"></i>
                        <i class="bi bi-circle-fill" style="color: #d62728;"></i>
                        <i class="bi bi-circle-fill" style="color: #ff7f0e;"></i>
                        Default
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item nucleotide-color-scheme-btn" data-scheme="wes" type="button">
                        <i class="bi bi-circle-fill" style="color: #F4B942;"></i>
                        <i class="bi bi-circle-fill" style="color: #DD7373;"></i>
                        <i class="bi bi-circle-fill" style="color: #0B775E;"></i>
                        <i class="bi bi-circle-fill" style="color: #35274A;"></i>
                        Wes Anderson
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item nucleotide-color-scheme-btn" data-scheme="verity" type="button">
                        <i class="bi bi-circle-fill" style="color: #FF1493;"></i>
                        <i class="bi bi-circle-fill" style="color: #FF69B4;"></i>
                        <i class="bi bi-circle-fill" style="color: #DB7093;"></i>
                        <i class="bi bi-circle-fill" style="color: #C71585;"></i>
                        Verity
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
              
              <!-- Navigate Differences -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group" aria-label="Navigate differences">
                  <button class="btn btn-sm btn-outline-secondary" id="diff-prev-btn" type="button" title="Jump to previous difference from reference">
                    <i class="bi bi-arrow-left-circle"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" id="diff-next-btn" type="button" title="Jump to next difference from reference">
                    <i class="bi bi-arrow-right-circle"></i>
                  </button>
                </div>
              </div>

              <!-- Tag Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-tag"></i> Tag
                  </button>
                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="0" type="button">
                        <i class="bi bi-circle-fill" style="color: #ff6b6b;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Red</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="1" type="button">
                        <i class="bi bi-circle-fill" style="color: #4ecdc4;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Teal</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="2" type="button">
                        <i class="bi bi-circle-fill" style="color: #45b7d1;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Blue</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="3" type="button">
                        <i class="bi bi-circle-fill" style="color: #f9ca24;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Yellow</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="4" type="button">
                        <i class="bi bi-circle-fill" style="color: #6c5ce7;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Purple</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="5" type="button">
                        <i class="bi bi-circle-fill" style="color: #a29bfe;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Lavender</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="6" type="button">
                        <i class="bi bi-circle-fill" style="color: #fd79a8;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Pink</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item tag-color-btn" data-tag-index="7" type="button">
                        <i class="bi bi-circle-fill" style="color: #fdcb6e;"></i> <span class="tag-name-edit" contenteditable="true" spellcheck="false">Orange</span>
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="clear-selected-tags-btn" type="button">
                        <i class="bi bi-eraser"></i> Clear selected tags
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="clear-all-tags-btn" type="button">
                        <i class="bi bi-x-circle"></i> Clear all tags
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="reset-tag-names-btn" type="button">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset tag names to defaults
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <!-- Bookmark Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-bookmark"></i> Bookmark
                  </button>
                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="0" type="button">
                        <i class="bi bi-circle-fill" style="color: #ff6b6b;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Red</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="1" type="button">
                        <i class="bi bi-circle-fill" style="color: #4ecdc4;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Teal</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="2" type="button">
                        <i class="bi bi-circle-fill" style="color: #45b7d1;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Blue</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="3" type="button">
                        <i class="bi bi-circle-fill" style="color: #f9ca24;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Yellow</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="4" type="button">
                        <i class="bi bi-circle-fill" style="color: #6c5ce7;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Purple</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="5" type="button">
                        <i class="bi bi-circle-fill" style="color: #a29bfe;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Lavender</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="6" type="button">
                        <i class="bi bi-circle-fill" style="color: #fd79a8;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Pink</span>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item bookmark-color-btn" data-bookmark-index="7" type="button">
                        <i class="bi bi-circle-fill" style="color: #fdcb6e;"></i> <span class="bookmark-name-edit" contenteditable="true" spellcheck="false">Orange</span>
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="clear-selected-bookmarks-btn" type="button">
                        <i class="bi bi-eraser"></i> Clear selected bookmarks
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="clear-all-bookmarks-btn" type="button">
                        <i class="bi bi-x-circle"></i> Clear all bookmarks
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="reset-bookmark-names-btn" type="button">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset bookmark names to defaults
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <!-- Sort Controls -->
              <div class="nav-item ms-2">
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-sort-alpha-down"></i> Sort
                  </button>
                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item" id="sort-original-btn" type="button">
                        <i class="bi bi-arrow-counterclockwise"></i> Original order
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="sort-label-btn" type="button">
                        <i class="bi bi-sort-alpha-down"></i> Sort by label (A→Z)
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="sort-label-reverse-btn" type="button">
                        <i class="bi bi-sort-alpha-up"></i> Sort by label (Z→A)
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="sort-column-btn" type="button">
                        <i class="bi bi-sort-down"></i> Sort by selected column (A→Z)
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="sort-column-reverse-btn" type="button">
                        <i class="bi bi-sort-up"></i> Sort by selected column (Z→A)
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="sort-start-pos-btn" type="button">
                        <i class="bi bi-arrow-right"></i> Sort by start position (0→N)
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="sort-start-pos-reverse-btn" type="button">
                        <i class="bi bi-arrow-left"></i> Sort by start position (N→0)
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="sort-seq-length-btn" type="button">
                        <i class="bi bi-arrow-bar-right"></i> Sort by sequence length (short→long)
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" id="sort-seq-length-reverse-btn" type="button">
                        <i class="bi bi-arrow-bar-left"></i> Sort by sequence length (long→short)
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="sort-tag-btn" type="button">
                        <i class="bi bi-tag"></i> Sort by tags (tagged first)
                      </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                      <button class="dropdown-item" id="fix-order-btn" type="button">
                        <i class="bi bi-lock"></i> Fix current order
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            
            <!-- Search -->
            <!-- <form class="d-flex" role="search" onsubmit="return false;">
              <input class="form-control me-2" type="search" id="search-input" placeholder="Search sequences" aria-label="Search">
              <button class="btn btn-outline-primary" id="search-next" type="button">
                <i class="bi bi-search"></i>
              </button>
            </form> -->
            
            <!-- Help Button -->
            <button class="btn btn-outline-secondary ms-2" id="help-btn" type="button" title="Show help">
              <i class="bi bi-question-circle"></i>
            </button>
          </div>
        </div>
      </nav>

      <!-- initialization status is shown in a centered overlay (#center-status) managed by the main script -->

      <div id="sealion"></div>

      <!-- Help Modal -->
      <div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="helpModalLabel"><i class="bi bi-question-circle me-2"></i>Sealion Instructions</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="help-content">
              <!-- Help content will be loaded here -->
              <div class="text-center py-5">
                <div class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- File Upload Modal -->
      <div class="modal fade" id="fileUploadModal" tabindex="-1" aria-labelledby="fileUploadModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="fileUploadModalLabel"><i class="bi bi-folder2-open me-2"></i>Open FASTA File</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="file-drop-zone" class="file-drop-zone text-center p-5 border border-2 border-dashed rounded">
                <i class="bi bi-cloud-arrow-up" style="font-size: 3rem; color: #6c757d;"></i>
                <p class="mt-3 mb-2">Drag and drop your FASTA file here</p>
                <p class="text-muted small">or</p>
                <input type="file" id="file-upload-input" accept=".fasta,.fa,.fna,.ffn,.faa,.frn" style="display: none;">
                <button class="btn btn-outline-primary" id="file-select-btn" type="button">
                  <i class="bi bi-file-earmark-text"></i> Choose File
                </button>
              </div>
              <div id="file-loading" class="text-center py-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading file...</p>
              </div>
              <div id="file-error" class="alert alert-danger mt-3" role="alert" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="file-error-text"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- debug HUD removed; use console for diagnostics -->
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <script type="text/javascript" src="ebov.js"></script>
    <script type="text/javascript" src="alignment.js"></script>
    <script type="text/javascript" src="sealion.js"></script>
    <script type="text/javascript" src="sealion/utils.js"></script>
    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
